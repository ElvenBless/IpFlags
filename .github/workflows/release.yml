# Сборка и публикация в GitHub Releases по настройкам FolderProfile (win-x64, single file)
name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (FolderProfile settings)
        run: |
          dotnet publish Src/IpFlags/IpFlags.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -o publish `
            /p:PublishSingleFile=true `
            /p:PublishReadyToRun=false

      - name: Zip artifact
        run: |
          Compress-Archive -Path publish\* -DestinationPath IpFlags-win-x64.zip

      - name: Create GitHub Release and upload
        uses: softprops/action-gh-release@v2
        with:
          files: IpFlags-win-x64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
