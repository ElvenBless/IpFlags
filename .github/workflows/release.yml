# Сборка и публикация в GitHub Releases при пуше в ветку Release
# Версия для тега и релиза берётся из <Version> в IpFlags.csproj
name: Build and Release

on:
  push:
    branches:
      - Release

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from csproj
        id: version
        run: |
          $xml = [xml](Get-Content 'Src/IpFlags/IpFlags.csproj')
          $version = ($xml.Project.PropertyGroup | Where-Object { $_.Version }).Version
          if (-not $version) { throw 'Version not found in IpFlags.csproj' }
          echo "VERSION=$version" >> $env:GITHUB_ENV
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish (с иконкой)
        run: |
          dotnet publish Src/IpFlags/IpFlags.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -o publish `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:PublishReadyToRun=false

      - name: Publish (без иконки — IpFlags_NoIco)
        run: |
          dotnet publish Src/IpFlags/IpFlags.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -o publish-noico `
            /p:BuildNoIcon=true `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:PublishReadyToRun=false

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$env:VERSION"
          git push origin "v$env:VERSION"

      - name: Create GitHub Release and upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          files: |
            publish/IpFlags.exe
            publish-noico/IpFlags_NoIco.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
